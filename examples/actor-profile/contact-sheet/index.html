<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>林知远 — 演员主页(联系印样)</title>
  <meta name="description" content="把演员主页做成一张联系印样:作品是底片上的帧,代表作被红笔圈出。">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../../styles/contact-sheet/tokens.css">
  <link rel="stylesheet" href="../../../shared/base.css">
  <link rel="stylesheet" href="../../../styles/contact-sheet/components.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 共用的滤镜与渐变:胶片颗粒、暗角、焦外虚化 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
      <radialGradient id="vig" cx="50%" cy="50%" r="78%">
        <stop offset="55%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity=".5"/>
      </radialGradient>
    </defs>
  </svg>

  <header class="bar container">
    <nav aria-label="面包屑">
      <ol class="crumbs">
        <li>影视库</li>
        <li>演员</li>
        <li aria-current="page">林知远</li>
      </ol>
    </nav>
    <a class="bar__back" href="../../../index.html">返回示例总览</a>
  </header>

  <main>
    <section class="hero container" aria-labelledby="name">
      <figure class="portrait" id="portrait">
        <div class="portrait__img" id="portraitImg"></div>
        <div class="crop" aria-hidden="true"><i class="corner corner--tl"></i><i class="corner corner--tr"></i><i class="corner corner--br"></i><i class="corner corner--bl"></i></div>
        <figcaption class="visually-hidden">林知远的肖像示意图(程序生成的占位图)</figcaption>
      </figure>

      <div class="hero__body">
        <h1 class="name" id="name">
          <span class="name__zh" id="nameZh"></span>
          <span class="name__en" id="nameEn"></span>
        </h1>
        <div class="hero__info">
          <p class="lede" id="lede"></p>
          <dl class="facts" id="facts"></dl>
          <div class="actions">
            <button class="btn btn-primary" id="follow" type="button" aria-pressed="false">关注</button>
            <button class="btn" id="share" type="button">分享</button>
            <span class="actions__status" id="status" role="status" aria-live="polite"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="sheet container" aria-labelledby="worksH">
      <div class="sheet__head">
        <h2 id="worksH">作品</h2>
        <div class="sheet__tools">
          <div class="seg" id="filter" role="group" aria-label="按类型筛选">
            <button type="button" data-type="all" aria-pressed="true">全部</button>
            <button type="button" data-type="电影" aria-pressed="false">电影</button>
            <button type="button" data-type="剧集" aria-pressed="false">剧集</button>
            <button type="button" data-type="综艺" aria-pressed="false">综艺</button>
          </div>
          <p class="sheet__count" id="count" role="status" aria-live="polite"></p>
        </div>
      </div>

      <ul class="legend" aria-label="红笔标记说明">
        <li>
          <svg viewBox="0 0 40 26" width="40" height="26" aria-hidden="true"><path class="mark" d="M6,13 C6,5 30,3 35,11 C39,19 14,25 6,17 C3,12 12,4 24,3"/></svg>
          <span>红圈:代表作</span>
        </li>
        <li>
          <svg viewBox="0 0 40 26" width="40" height="26" aria-hidden="true"><path class="mark" d="M3,9 L3,3 L9,3 M31,3 L37,3 L37,9 M37,17 L37,23 L31,23 M9,23 L3,23 L3,17"/></svg>
          <span>角标:最近看过</span>
        </li>
        <li>
          <svg viewBox="0 0 40 26" width="40" height="26" aria-hidden="true"><path class="mark" d="M8,3 L32,23 M32,3 L8,23"/></svg>
          <span>红叉:不在当前筛选内</span>
        </li>
      </ul>

      <div id="strips" class="strips"></div>
    </section>

    <section class="about container">
      <div class="about__bio" aria-labelledby="bioH">
        <h2 id="bioH">简介</h2>
        <div class="prose" id="bio"></div>
      </div>
      <div class="about__awards" aria-labelledby="awardsH">
        <h2 id="awardsH">获奖</h2>
        <ul class="credits" id="awards"></ul>
      </div>
    </section>

    <section class="costars container" aria-labelledby="costarsH">
      <h2 id="costarsH">常合作的演员</h2>
      <ul class="prints" id="costars"></ul>
    </section>
  </main>

  <footer class="foot container">
    <p>示例页面。人物、作品、奖项均为虚构,画面为程序生成的占位图。</p>
    <a href="../../../index.html">返回示例总览</a>
  </footer>

  <dialog class="loupe" id="loupe" aria-labelledby="loupeTitle">
    <div class="loupe__film" id="loupeImg"></div>
    <div class="loupe__body">
      <p class="loupe__flag" id="loupeFlag" hidden>
        <svg viewBox="0 0 40 26" width="32" height="21" aria-hidden="true"><path class="mark" d="M6,13 C6,5 30,3 35,11 C39,19 14,25 6,17 C3,12 12,4 24,3"/></svg>
        <span>代表作</span>
      </p>
      <h3 id="loupeTitle" class="loupe__title"></h3>
      <p class="loupe__line" id="loupeLine"></p>
      <dl class="loupe__facts" id="loupeFacts"></dl>
      <div class="loupe__nav">
        <button class="btn" type="button" id="prev">上一部</button>
        <button class="btn" type="button" id="next">下一部</button>
        <button class="btn btn-primary" type="button" id="close">关闭</button>
      </div>
    </div>
  </dialog>

  <script src="./data.js"></script>
  <script src="./art.js"></script>
  <script src="./main.js"></script>
</body>
</html>
